), для 3 подставляется NA.\n  - Строки 66–67: right_join(y, by = \"key\") — остаются все ключи из y (1, 2, 4), для 4 подставляется NA.\n  - Строки 72–73: full_join(y, by = \"key\") — остаются все ключи (1, 2, 3, 4).\n  - Строки 77–114: примеры с повторяющимися ключами в одной или обеих таблицах: если в обеих таблицах ключ 2 встречается дважды, то left_join выдаст все их комбинации (2 × 2 = 4 строки для ключа 2).","type":"text"},{"text":"Соединение по столбцам с разными именами (строки 117–133, активный код)","type":"heading"},{"text":"117: x \u003c- tribble(\n118:   ~key, ~ val_x,\n119:   1,\"x1\",\n120:   2,\"x2\",\n121:   3,\"x3\",\n122:   )\n123: print(x)\n124: y \u003c- tribble(\n125:   ~key, ~ val_x,\n126:   1,\"y1\",\n127:   2,\"y2\",\n128:   3,\"y3\",\n129: )\n130: print(y)\n132: xy_left4 \u003c- left_join(x, y, by = c(\"key_x\"=\"key_y\"))\n133: print(xy_left4)","type":"code"},{"text":"  [!] Важное замечание (опечатка в учебном скрипте): в строках 118 и 125 ключевые столбцы названы одинаково (~key), а в строке 132 в by = c(\"key_x\" = \"key_y\") указаны имена key_x и key_y. При запуске строки 132 R выдаст ошибку, потому что столбцов key_x и key_y в этих таблицах нет. Чтобы пример работал, нужно либо назвать столбцы ~key_x и ~key_y, либо написать by = \"key\".","type":"note"},{"text":"Практический пример с аэропортами и переименованием (строки 136–145, активный код)","type":"heading"},{"text":"136: # создадим уменьшенную копию таблицы о авиаперевозках\n137: fl2 \u003c- flights %\u003e% select(year:day, hour, origin, dest, tailnum, carrier)\n138: print(fl2)","type":"code"},{"text":"Снова создаём компактную таблицу рейсов fl2.","type":"text"},{"text":"139: #добавить в таблицу полное название аэропорта из фрейма airports\n140: fl3 \u003c- fl2 %\u003e% left_join(airports %\u003e% select(\u0027faa\u0027, \u0027name\u0027), by= c(\u0027dest\u0027=\u0027faa\u0027))\n141: print(fl3)","type":"code"},{"text":"Очень красивый приём:\n1. Из таблицы airports заранее берём только два столбца — код аэропорта \u0027faa\u0027 и его название \u0027name\u0027 (airports %\u003e% select(\u0027faa\u0027, \u0027name\u0027)), чтобы не тащить лишние столбцы (координаты, часовой пояс и т.д.).\n2. Присоединяем их к fl2 с помощью left_join, указав by = c(\u0027dest\u0027 = \u0027faa\u0027) — то есть «ищи совпадение между столбцом dest из левой таблицы и столбцом faa из правой».","type":"text"},{"text":"143: fl4 \u003c- fl2 %\u003e% left_join(airports %\u003e% select(\u0027faa\u0027, \u0027name\u0027), by = c(\"dest\"=\"faa\"))%\u003e%\n144: rename(dest_name=name)\n145: print(fl4)","type":"code"},{"text":"То же самое соединение, но в конце добавлен шаг rename(dest_name = name): появившийся столбец name переименовывается в более понятное имя dest_name (название аэропорта прилёта). Обратите внимание на порядок в rename(): новое_имя = старое_имя.","type":"text"}],"rawCode":"library(nycflights13)\r\nlibrary(tidyverse)\r\n\r\n# flights - основная таблица описания авиаоейсов\r\n  view(flights)\r\n# airlines - полное название перевозчика (авиакомпании)\r\nview(airlines)\r\n# airports - инфа о каждом аэропорте\r\nview(airports)\r\n# planes - \r\nview(planes)\r\n# weather - инфа о погоде\r\nview(weather)\r\n\r\n# проверка,все ли записи в столбце, который определен, как ключевой,будут уникальными\r\n# print(planes %\u003e% count(tailnum) %\u003e% filter(n\u003e1))\r\nprint(weather %\u003e% count(year, month, day, hour, origin) %\u003e% filter(n\u003e1))\r\n# создадим уменьшенную копию таблицы о авиаперевозках\r\nfl2 \u003c- flights %\u003e% select(year:day, hour, origin, dest, tailnum, carrier)\r\nprint(fl2)\r\n# # в фрейм fl2 добавим название авиакомпаний (1й параметр \"airlines\" - откуда берем данные,\r\n# # 2й параметр \"carrier\" - какое поле является ключевым)\r\nfl3 \u003c- fl2 %\u003e% left_join(airlines, by =\u0027carrier\u0027)\r\nprint(fl3)\r\n# # в фрейм fl2 добавим название авиакомпаний (1й параметр \"airlines\" - откуда берем новые данные,\r\n# # 2й параметр \"carrier\" - какое поле является ключевым) удалим краткое название авиакомпании\r\nfl3 \u003c- fl2 %\u003e% left_join(airlines, by =\u0027carrier\u0027) %\u003e% select(carrier)\r\nprint(fl3)\r\n# \r\n# #создадим 2 небольших фрейма для наголядной демонстрации объединения нескольких фреймов\r\n# \r\n# x \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"x1\",\r\n#   2,\"x2\",\r\n#   3,\"x3\",\r\n# )\r\n# print(x)\r\n# \r\n# y \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"y1\",\r\n#   2,\"y2\",\r\n#   4,\"y4\",\r\n# )\r\n# print(y)\r\n# \r\n# # внутреннее соежинение, в новый фрейм попадают только те данные, для которых найдено\r\n# # пара по ключевому столбцу\r\n# \r\n# # xy \u003c- x %\u003e% inner_join(y,by=\"key\")\r\n# # print(xy)\r\n# \r\n# #внешнее соединение\r\n# # левое соединение: данные помещаются в первую таблицу в первый фрейм,\r\n# # если в 1й табл есть ключ без пары, то для него подставится значение \"NA\"\r\n# # если во 2й табл есть ключ без пары, то это значение отбросится\r\n# \r\n# xy_left \u003c- x %\u003e% left_join(y, by=\"key\")\r\n# print(xy_left)\r\n# \r\n# # правое соединение: данные помещаются во 2ю таблицу (справа),\r\n# # если в 2й табл есть ключ без пары, то для него подставится значение \"NA\"\r\n# # если во 1й табл есть ключ без пары, то это значение отбросится\r\n# \r\n# xy_right \u003c- x %\u003e% right_join(y, by=\"key\")\r\n# print(xy_right)\r\n# \r\n# # полное соединение: значение по совпадению ключей добавляется,\r\n# # а для ключей с 1й и 2й таблицы без пары добавляется значение NA\r\n# \r\n# xy_full \u003c- x %\u003e% full_join(y, by=\"key\")\r\n# print(xy_full)\r\n# \r\n# #пример создания фрейма для демонстрации соединения таблиц с неуникальными ключами\r\n# \r\n# x \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"x1\",\r\n#   2,\"x2\",\r\n#   2,\"x3\",\r\n#   1,\"x4\",\r\n# )\r\n# print(x)\r\n# y \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"y1\",\r\n#   2,\"y2\",\r\n#   )\r\n# print(y)\r\n# # ситуация, где в 1й табл ключи не уникальные, во 2й табл ключи уникальные\r\n# xy_left2 \u003c- x %\u003e% left_join(y, by = \"key\")\r\n# print(xy_left2)\r\n# \r\n# # ситуация, где в 1й и 2й табл ключи не уникальные\r\n# x \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"x1\",\r\n#   2,\"x2\",\r\n#   2,\"x3\",\r\n#   3,\"x4\",\r\n# )\r\n# print(x)\r\n# y \u003c- tribble(\r\n#   ~key, ~ val_x,\r\n#   1,\"y1\",\r\n#   2,\"y2\",\r\n#   2,\"y3\",\r\n#   3,\"y4\",\r\n# )\r\n# print(y)\r\n# \r\n# xy_left3 \u003c- left_join(x, y, by = \"key\")\r\n# print(xy_left3)\r\n\r\n\r\nx \u003c- tribble(\r\n  ~key, ~ val_x,\r\n  1,\"x1\",\r\n  2,\"x2\",\r\n  3,\"x3\",\r\n  )\r\nprint(x)\r\ny \u003c- tribble(\r\n  ~key, ~ val_x,\r\n  1,\"y1\",\r\n  2,\"y2\",\r\n  3,\"y3\",\r\n)\r\nprint(y)\r\n\r\nxy_left4 \u003c- left_join(x, y, by = c(\"key_x\"=\"key_y\"))\r\nprint(xy_left4)\r\n\r\n\r\n# создадим уменьшенную копию таблицы о авиаперевозках\r\nfl2 \u003c- flights %\u003e% select(year:day, hour, origin, dest, tailnum, carrier)\r\nprint(fl2)\r\n#добавить в таблицу полное название аэропорта из фрейма airports\r\nfl3 \u003c- fl2 %\u003e% left_join(airports %\u003e% select(\u0027faa\u0027, \u0027name\u0027), by= c(\u0027dest\u0027=\u0027faa\u0027))\r\nprint(fl3)\r\n\r\nfl4 \u003c- fl2 %\u003e% left_join(airports %\u003e% select(\u0027faa\u0027, \u0027name\u0027), by = c(\"dest\"=\"faa\"))%\u003e%\r\nrename(dest_name=name)\r\nprint(fl4)\r\n\r\n\r\n\r\n","dictionary":[{"term":"count(столбец)","details":["Что делает: Считает, сколько раз встречается каждое значение","Аналогия с ВПР / SQL: Сводная таблица «Количество»"]},{"term":"tribble(~col1, ~col2, ...)","details":["Что делает: Удобный способ создать маленькую таблицу прямо в коде, записывая её по строкам (как обычную таблицу)","Аналогия с ВПР / SQL: Мини-табличка для теста"]},{"term":"left_join(x, y, by = \"key\")","details":["Что делает: Левое соединение: берёт все строки из таблицы x и подтягивает к ним совпадения из y. Если пары в y нет — ставит NA","Аналогия с ВПР / SQL: Классический ВПР в Excel"]},{"term":"right_join(x, y, by = \"key\")","details":["Что делает: Правое соединение: то же самое, но сохраняет все строки из правой таблицы y","Аналогия с ВПР / SQL: ВПР наоборот"]},{"term":"inner_join(x, y, by = \"key\")","details":["Что делает: Внутреннее соединение: оставляет только те строки, у которых нашлась пара в обеих таблицах","Аналогия с ВПР / SQL: Пересечение двух списков"]},{"term":"full_join(x, y, by = \"key\")","details":["Что делает: Полное соединение: сохраняет все строки из обеих таблиц; где нет пары — ставит NA","Аналогия с ВПР / SQL: Объединение двух списков"]},{"term":"by = c(\"a\" = \"b\")","details":["Что делает: Указывает, что столбец \"a\" в левой таблице соответствует столбцу \"b\" в правой","Аналогия с ВПР / SQL: Когда колонки с кодами названы по-разному"]},{"term":"rename(новое = старое)","details":["Что делает: Переименовывает столбец в таблице","Аналогия с ВПР / SQL: Переименовать заголовок колонки"]}],"tag":"joins"}]},{"color":"#059669","title":"День 3: Факторы и даты/время","id":3,"subtitle":"forcats (категории и порядок) и lubridate (даты, время, графики)","scripts":[{"id":"3.1","overview":"Этот скрипт знакомит с особым типом данных в R — факторами (factors), с которыми работает пакет forcats (входит в tidyverse).\n\nФактор — это текстовая категория с заранее заданным набором допустимых значений (уровней) и их правильным порядком. Обычный текст в R сортируется строго по алфавиту (\"Apr\", \"Dec\", \"Jan\", \"Mar\"), а фактор позволяет задать логический порядок (например, месяцы года: \"Jan\", \"Feb\", \"Mar\"...) и сразу ловить опечатки (например, \"Jam\" вместо \"Jan\" превратится в NA).\n\nЧто вы научитесь делать:\n  - понимать разницу между обычным списком строк и фактором;\n  - задавать свой словарь допустимых значений (levels);\n  - сортировать фактор не по алфавиту, а по смыслу;\n  - находить опечатки в данных через превращение неизвестных значений в NA;\n  - создавать фактор с порядком, как в исходном списке (unique).","name":"3.1 Знакомство с факторами.R","lineCount":46,"walkthrough":[{"text":"1: library(nycflights13)\n2: library(tidyverse)\n3: library(forcats)","type":"code"},{"text":"Подключаем пакет с учебными данными, основной набор tidyverse и пакет forcats для работы с факторами.","type":"text"},{"text":"4: x1 \u003c- c(\"Dec\",\"Apr\",\"Jan\",\"Mar\")\n5: x2 \u003c- c(\"Dec\",\"Apr\",\"Jam\",\"Mar\")\n6: print(x1)\n7: print(x2)","type":"code"},{"text":"Создаём два обычных текстовых списка: x1 — с четырьмя корректными названиями месяцев, x2 — с опечаткой (\"Jam\" вместо \"Jan\"). Выводим оба в консоль.","type":"text"},{"text":"9: print(sort(x1))","type":"code"},{"text":"Пробуем отсортировать обычный текст x1. R отсортирует его по алфавиту: \"Apr\", \"Dec\", \"Jan\", \"Mar\". Для месяцев года это неправильный порядок.","type":"text"},{"text":"Создание фактора со своим списком уровней","type":"heading"},{"text":"14: month_levels \u003c-c(\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\")","type":"code"},{"text":"Создаём справочник month_levels — правильный порядок месяцев.\n  [!] Примечание: в этом учебном списке преподаватель случайно пропустил месяц \"May\" (май). Если бы в данных встретился \"May\", он бы превратился в NA.","type":"text"},{"text":"15: y1 \u003c-factor(x1,levels=month_levels)\n16: print(y1)\n17: print(sort(y1))","type":"code"},{"text":"Превращаем x1 в фактор y1, опираясь на справочник month_levels.\nПри выводе y1 в консоль R покажет сами значения и строчку Levels: Jan Feb Mar ... Dec.\nТеперь sort(y1) отсортирует месяцы правильно по календарю: Jan, Mar, Apr, Dec!","type":"text"},{"text":"Как фактор отлавливает опечатки","type":"heading"},{"text":"21: y2 \u003c-factor(x2,levels=month_levels)\n22: print(y2)","type":"code"},{"text":"Создаём фактор y2 из списка x2, где была опечатка \"Jam\". Так как слова \"Jam\" нет в справочнике month_levels, R без лишних вопросов заменит его на NA (пропуск): Dec, Apr, NA, Mar.","type":"text"},{"text":"Создание фактора без справочника уровней","type":"heading"},{"text":"26: y3 \u003c-factor(x1)\n27: print(y3)","type":"code"},{"text":"Если не указывать levels, R сам соберёт уровни из данных и расставит их по алфавиту: Levels: Apr Dec Jan Mar.","type":"text"},{"text":"31: y4 \u003c- factor(x1, levels= unique(x1))\n32: print(y4)","type":"code"},{"text":"Хитрость: levels = unique(x1) заставляет R взять уникальные значения в том самом порядке, в котором они идут в исходном списке x1 (Dec, Apr, Jan, Mar).","type":"text"},{"text":"36: x3 \u003c- c(\"Dec\",\"Apr\",\"Jan\",\"Mar\",\"Apr\",\"Dec\",\"Mar\",\"Apr\")\n37: y5 \u003c-factor(x3, levels=unique(x3))\n38: print(y5)","type":"code"},{"text":"Даже если в исходном списке x3 значения повторяются много раз, unique(x3) выделит только первые вхождения каждого месяца, и в levels попадут только 4 уникальных уровня: Dec, Apr, Jan, Mar.","type":"text"}],"rawCode":"library(nycflights13)\r\nlibrary(tidyverse)\r\nlibrary(forcats)\r\nx1 \u003c- c(\"Dec\",\"Apr\",\"Jan\",\"Mar\")\r\nx2 \u003c- c(\"Dec\",\"Apr\",\"Jam\",\"Mar\")\r\nprint(x1)\r\nprint(x2)\r\n\r\nprint(sort(x1))\r\n\r\n# # создание фактора:\r\n# 1) создаем список со всеми значениями категории\r\n# 2) на базе списка и источника данных создаем фактор\r\nmonth_levels \u003c-c(\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\")\r\ny1 \u003c-factor(x1,levels=month_levels)\r\nprint(y1)\r\nprint(sort(y1))\r\n\r\n#если в источике данных есть элемент который не входит в список фактора,\r\n# он заменится на значение NA\r\ny2 \u003c-factor(x2,levels=month_levels)\r\nprint(y2)\r\n\r\n# создание фактора на основе источника данных без списка уровней\r\n# (в фактор все элементы добавятся в алфавитном порядке)\r\ny3 \u003c-factor(x1)\r\nprint(y3)\r\n\r\n# созданеи фактора на основе источника данных без списка уровней\r\n# (в фактор элементы добавялются в порядке, как в источнике данных)\r\ny4 \u003c- factor(x1, levels= unique(x1))\r\nprint(y4)             \r\n\r\n# при создании фактора на базе источника без списка уровней\r\n# в фактор добавятся только уникальные значения\r\nx3 \u003c- c(\"Dec\",\"Apr\",\"Jan\",\"Mar\",\"Apr\",\"Dec\",\"Mar\",\"Apr\")\r\ny5 \u003c-factor(x3, levels=unique(x3))\r\nprint(y5)\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n","dictionary":[{"term":"library(forcats)","details":["Что это и зачем нужно: Подключает пакет для удобной работы с факторами (название — анаграмма слова factors)","Аналогия из Excel: Выпадающий список (Проверка данных) со строгим перечнем значений"]},{"term":"c(\"Dec\", \"Apr\", ...)","details":["Что это и зачем нужно: Создаёт вектор — простой одномерный список значений","Аналогия из Excel: Столбец с текстом"]},{"term":"sort(x)","details":["Что это и зачем нужно: Сортирует значения в списке x. Для обычного текста — по алфавиту, для фактора — по порядку его уровней","Аналогия из Excel: Сортировка от А до Я или по настраиваемому списку"]},{"term":"factor(данные, levels = список)","details":["Что это и зачем нужно: Превращает список строк в фактор с заданным перечнем и порядком допустимых значений (уровней)","Аналогия из Excel: Привязать столбец к справочнику допустимых значений"]},{"term":"levels = ...","details":["Что это и зачем нужно: Параметр функции factor(), задающий разрешённые категории и их порядок следования","Аналогия из Excel: Пользовательский список для сортировки (Янв, Фев, Мар...)"]},{"term":"unique(x)","details":["Что это и зачем нужно: Оставляет из списка x только уникальные значения, убирая дубликаты, в том порядке, в котором они встретились впервые","Аналогия из Excel: Удалить дубликаты"]},{"term":"NA","details":["Что это и зачем нужно: Пустое (отсутствующее) значение. В факторе появляется автоматически, если встретилось значение, которого нет в levels","Аналогия из Excel: Нераспознанное значение / пустая ячейка"]}],"tag":"factor"},{"id":"3.2","overview":"Этот скрипт показывает, зачем на практике менять порядок уровней фактора и как это делает графики намного понятнее и красивее.\n\nВ качестве данных используется встроенная в пакет forcats таблица gss_cat — результаты крупного социологического опроса в США (год, семейное положение, возраст, доход, раса, религия, часы просмотра ТВ в день и т.д.).\n\nЧто вы научитесь делать:\n  - считать количество элементов по категориям (count) и строить столбчатые диаграммы (geom_bar);\n  - показывать на графике даже пустые категории с нулём наблюдений (drop = FALSE);\n  - сортировать категории на графике по числовому показателю (fct_reorder);\n  - переносить выбранные категории в начало списка (fct_relevel);\n  - выравнивать цвета в легенде линейного графика (fct_reorder2);\n  - сортировать столбцы диаграммы по частоте встречаемости (fct_infreq и fct_rev).","name":"3.2 Факторы изменения порядка следования.R","lineCount":81,"walkthrough":[{"text":"1: library(tidyverse)\n2: library(forcats)\n4: # print(gss_cat)\n5: # View(gss_cat)","type":"code"},{"text":"Подключаем пакеты. Закомментированные строки 4–5 позволяют при желании посмотреть таблицу gss_cat целиком.","type":"text"},{"text":"График по расам и пустые уровни фактора","type":"heading"},{"text":"8: rez \u003c- gss_cat %\u003e% count(race)\n9: print(rez)","type":"code"},{"text":"Считаем, сколько людей каждой расы в опросе. У фактора race есть уровень \"Not applicable\", но в таблице людей с таким значением 0, поэтому count() его не выведет.","type":"text"},{"text":"12: g \u003c- ggplot(gss_cat, aes(race)) + geom_bar()\n13: print(g)","type":"code"},{"text":"Строим столбчатую диаграмму по расам. По умолчанию ggplot тоже скрывает пустые уровни.","type":"text"},{"text":"16: g2 \u003c- ggplot(gss_cat, aes(race)) + geom_bar() + scale_x_discrete(drop=FALSE)\n17: print(g2)","type":"code"},{"text":"Добавляем scale_x_discrete(drop = FALSE) — теперь на оси X отобразятся все уровни фактора, включая пустые (с нулевой высотой столбца).","type":"text"},{"text":"Сортировка категорий на графике: fct_reorder()","type":"heading"},{"text":"21: relig \u003c- gss_cat %\u003e% group_by(relig) %\u003e% summarise(\n22:   age = mean(age, na.rm = TRUE),\n23:   tvhours = mean(tvhours, na.rm = TRUE),\n24:   n = n()\n25: )\n26: g3 \u003c- ggplot(relig, aes(tvhours, relig)) + geom_point()\n27: print(g3)","type":"code"},{"text":"Группируем данные по религии (relig), считаем средний возраст, среднее число часов перед ТВ (tvhours) и количество опрошенных n. Строим точечный график g3: точки разбросаны хаотично, читать график неудобно.","type":"text"},{"text":"34: g4 \u003c- ggplot(relig, aes(tvhours, fct_reorder(relig,tvhours))) + geom_point()\n35: print(g4)","type":"code"},{"text":"Оборачиваем relig в fct_reorder(relig, tvhours). Теперь религии на вертикальной оси выстроились строго по возрастанию времени просмотра ТВ — от меньшего к большему. График стал наглядным.","type":"text"},{"text":"Перемещение элемента в начало: fct_relevel()","type":"heading"},{"text":"39: rincome \u003c- gss_cat %\u003e% group_by(rincome) %\u003e% summarise(\n40:   age = mean(age, na.rm = TRUE),\n41:   n = n()\n42: )\n43: g5 \u003c- ggplot(rincome, aes(age, fct_relevel(rincome, \"Not applicable\"))) + geom_point()\n44: print(g5)","type":"code"},{"text":"Считаем средний возраст по уровням дохода (rincome). Здесь категории дохода уже имеют естественный порядок (от меньших сумм к большим), поэтому fct_reorder() всё бы испортил. Вместо этого с помощью fct_relevel(rincome, \"Not applicable\") мы переносим строку \"Not applicable\" («Не применимо») в самый низ/начало оси, чтобы она не смешивалась с суммами дохода.","type":"text"},{"text":"Упорядочивание легенды на линейном графике: fct_reorder2()","type":"heading"},{"text":"47: by_age \u003c- gss_cat %\u003e% filter(!is.na(age)) %\u003e% group_by(age, marital) %\u003e% count() %\u003e% mutate(prop = n)\n48: g6 \u003c- ggplot(by_age, aes(age, prop, color = marital)) + geom_line(na.rm = TRUE)\n49: print(g6)","type":"code"},{"text":"Считаем количество людей каждого возраста (age) и семейного положения (marital) и строим многоцветный линейный график g6. Порядок цветов в легенде не совпадает с расположением линий на графике.","type":"text"},{"text":"53: g7 \u003c- ggplot(by_age, aes(age, prop, color = fct_reorder2(marital, age, prop))) + geom_line()+\n54:   labs(color=\"marital\")\n55: print(g7)","type":"code"},{"text":"Функция fct_reorder2(marital, age, prop) расставляет пункты легенды сверху вниз точно так же, как идут линии в правой части графика. А labs(color = \"marital\") возвращает легенде аккуратное название вместо длинной формулы.","type":"text"},{"text":"Сортировка столбцов по частоте: fct_infreq() и fct_rev()","type":"heading"},{"text":"58: g8 \u003c- gss_cat %\u003e% mutate(marital = marital %\u003e% fct_infreq() %\u003e% fct_rev()) %\u003e% ggplot(aes(marital)) + geom_bar()\n59: print(g8)","type":"code"},{"text":"Преобразуем столбец marital прямо перед построением графика:\n  1) fct_infreq() сортирует категории от самой частой к самой редкой;\n  2) fct_rev() разворачивает этот порядок наоборот — от самой редкой к самой частой.\nВ итоге столбцы на диаграмме g8 растут слева направо аккуратной лесенкой.","type":"text"},{"text":"62: g9 \u003c- gss_cat %\u003e% ggplot(aes(marital)) + geom_bar()\n63: print(g9)","type":"code"},{"text":"Тот же график без сортировки категорий — для сравнения, насколько нагляднее выглядит вариант g8.","type":"text"}],"rawCode":"library(tidyverse)\r\nlibrary(forcats)\r\n\r\n# print(gss_cat)\r\n# View(gss_cat)\r\n\r\n# демонстрация фактора по колонке раса в виде списка\r\nrez \u003c- gss_cat %\u003e% count(race)\r\nprint(rez)\r\n\r\n# графическая демонстрация фактора по колонке раса\r\ng \u003c- ggplot(gss_cat, aes(race)) + geom_bar()\r\nprint(g)\r\n\r\n# графическая демонстрация фактора по колонке раса (с отображением не выбранных элементов)\r\ng2 \u003c- ggplot(gss_cat, aes(race)) + geom_bar() + scale_x_discrete(drop=FALSE)\r\nprint(g2)\r\n\r\n# построим график зависимости часов просмотра телевизора в связи с религией\r\n# строим график по данным в том порядке как он находится в источнике\r\nrelig \u003c- gss_cat %\u003e% group_by(relig) %\u003e% summarise(\r\n  age = mean(age, na.rm = TRUE),\r\n  tvhours = mean(tvhours, na.rm = TRUE),\r\n  n = n()\r\n)\r\ng3 \u003c- ggplot(relig, aes(tvhours, relig)) + geom_point()\r\nprint(g3)\r\n\r\n# для изменения порядка следования элементов в факторе используется функция fct_reorder\r\n# функция fct_reorder принимает на вход 3 параметра:\r\n# 1 - фактор, уровни которого нужно изменить\r\n# 2 - числовой вектор, который необходимо использовать для изменения порядка элементов фактора\r\n# 3 - функция которая используется, если для каждого значения из пункта 1 несколько значений (необязательный)\r\ng4 \u003c- ggplot(relig, aes(tvhours, fct_reorder(relig,tvhours))) + geom_point()\r\nprint(g4)\r\n\r\n# перемещение нескольких элементов фактора в начало, для этого используется функция fct_relevel\r\n# функция fct_relevel принимает на вход фактор и элементы которые необходимо переместить в начало\r\nrincome \u003c- gss_cat %\u003e% group_by(rincome) %\u003e% summarise(\r\n  age = mean(age, na.rm = TRUE),\r\n  n = n()\r\n)\r\ng5 \u003c- ggplot(rincome, aes(age, fct_relevel(rincome, \"Not applicable\"))) + geom_point()\r\nprint(g5)\r\n\r\n\r\nby_age \u003c- gss_cat %\u003e% filter(!is.na(age)) %\u003e% group_by(age, marital) %\u003e% count() %\u003e% mutate(prop = n)\r\ng6 \u003c- ggplot(by_age, aes(age, prop, color = marital)) + geom_line(na.rm = TRUE)\r\nprint(g6)\r\n\r\n# перестройка значений в факторе по значению \"у\" связанным с наибольшим значением \"x\"\r\n# (на графике цвет линий выравнивается с легендой), для этого можно воспользоваться функцие fct_reorder2\r\ng7 \u003c- ggplot(by_age, aes(age, prop, color = fct_reorder2(marital, age, prop))) + geom_line()+\r\n  labs(color=\"marital\")\r\nprint(g7)\r\n\r\n# перестройка значений в факторе по возрастанию значений для постройки столбчатой диаграммы\r\ng8 \u003c- gss_cat %\u003e% mutate(marital = marital %\u003e% fct_infreq() %\u003e% fct_rev()) %\u003e% ggplot(aes(marital)) + geom_bar()\r\nprint(g8)\r\n\r\n# построить тот же график, но без изменения категорий факторов:\r\ng9 \u003c- gss_cat %\u003e% ggplot(aes(marital)) + geom_bar()\r\nprint(g9)\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n\r\n","dictionary":[{"term":"gss_cat","details":["Что это и зачем нужно: Готовая учебная таблица социологического опроса (встроена в forcats)"]},{"term":"count(столбец)","details":["Что это и зачем нужно: Подсчитывает, сколько строк приходится на каждую категорию"]},{"term":"ggplot(данные, aes(...)) + geom_bar()","details":["Что это и зачем нужно: Строит столбчатую диаграмму количества элементов в каждой категории"]},{"term":"scale_x_discrete(drop = FALSE)","details":["Что это и зачем нужно: Заставляет ggplot показать на оси X даже те уровни фактора, у которых в данных 0 строк"]},{"term":"geom_point()","details":["Что это и зачем нужно: Рисует точечный график"]},{"term":"geom_line()","details":["Что это и зачем нужно: Рисует линейный график"]},{"term":"fct_reorder(фактор, число)","details":["Что это и зачем нужно: Меняет порядок уровней фактора по возрастанию связанного с ними числового столбца (чтобы точки на графике выстроились лесенкой, а не вразброс)"]},{"term":"fct_relevel(фактор, \"элемент\")","details":["Что это и зачем нужно: Перемещает указанный элемент (или несколько) в самое начало списка уровней фактора"]},{"term":"fct_reorder2(фактор, x, y)","details":["Что это и зачем нужно: Для линейных графиков: сортирует категории в легенде в том порядке, в каком линии заканчиваются на правом краю графика (по y при максимальном x)"]},{"term":"fct_infreq(фактор)","details":["Что это и зачем нужно: Сортирует уровни фактора по частоте — от самой многочисленной категории к самой редкой"]},{"term":"fct_rev(фактор)","details":["Что это и зачем нужно: Переворачивает порядок уровней фактора задом наперёд (в паре с fct_infreq даёт порядок от меньшего к большему)"]},{"term":"labs(color = \"название\")","details":["Что это и зачем нужно: Задаёт понятную подпись для легенды цвета на графике"]}],"tag":"fct_reorder"},{"id":"3.3","overview":"Этот скрипт учит менять сами названия (значения) категорий фактора, а также объединять мелкие или похожие категории в более крупные группы.\n\nНа примере столбца partyid (политические взгляды опрошенных из таблицы gss_cat) разбираются три главные функции пакета forcats:\n  - fct_recode() — переименование отдельных категорий (и ручное склеивание нескольких в одну);\n  - fct_collapse() — удобное объединение целых списков старых категорий в новые группы;\n  - fct_lump() — автоматическое слияние всех мелких/редких категорий в одну общую группу \"Other\".","name":"3.3 Факторы изменения значений элементов.R","lineCount":57,"walkthrough":[{"text":"1: library(tidyverse)\n2: library(forcats)\n4: # содержимое столбца\n5: # print(gss_cat$partyid)\n6: # выведем фактор связанный с столбцом partyid\n7: print(gss_cat %\u003e% count(partyid))","type":"code"},{"text":"Подключаем пакеты и смотрим все исходные категории политических взглядов в столбце partyid (их 10 штук: Strong republican, Not str republican, Ind,near rep и т.д.).","type":"text"},{"text":"Переименование значений: fct_recode()","type":"heading"},{"text":"13: rez \u003c- gss_cat %\u003e% mutate(partyid = fct_recode(partyid,\n14:   \u0027Republican, stronge\u0027 = \u0027Strong republican\u0027,\n15:   \u0027Republican, weak\u0027 = \u0027Not str republican\u0027,\n16:   \u0027Independent, near rep\u0027 = \u0027Ind,near rep\u0027,\n17:   \u0027Independent, near dem\u0027 = \u0027Ind,near dem\u0027,\n18:   \u0027Democrat, weak\u0027 = \u0027Not str democrat\u0027,\n19:   \u0027Democrat, stronge\u0027 = \u0027Strong democrat\u0027\n20: ))\n21: print(rez %\u003e% count(partyid))","type":"code"},{"text":"С помощью mutate() перезаписываем столбец partyid. Внутри fct_recode() действует правило:\n  НОВОЕ_ИМЯ = СТАРОЕ_ИМЯ\nШесть сокращённых названий заменяются на более понятные, а остальные 4 (\"No answer\", \"Don\u0027t know\", \"Other party\", \"Independent\") остаются без изменений.\n  [!] Примечание: в строках 14 и 19 в учебном примере допущена опечатка в английском слове — написано \u0027stronge\u0027 вместо \u0027strong\u0027.","type":"text"},{"text":"Объединение нескольких категорий через fct_recode()","type":"heading"},{"text":"26: res2 \u003c- gss_cat %\u003e% mutate(partyid = fct_recode(partyid,\n27:   \u0027Republican, stronge\u0027 = \u0027Strong republican\u0027,\n28:   \u0027Republican, weak\u0027 = \u0027Not str republican\u0027,\n29:   \u0027Independent, near rep\u0027 = \u0027Ind,near rep\u0027,\n30:   \u0027Independent, near dem\u0027 = \u0027Ind,near dem\u0027,\n31:   \u0027Democrat, weak\u0027 = \u0027Not str democrat\u0027,\n32:   \u0027Democrat, stronge\u0027 = \u0027Strong democrat\u0027,\n33:   \u0027Other\u0027= \u0027No answer\u0027,\n34:   \u0027Other\u0027= \"Don\u0027t know\",\n35:   \u0027Other\u0027= \u0027Other party\u0027\n36: ))\n37: print(res2 %\u003e% count(partyid))","type":"code"},{"text":"В строках 33–35 трём разным старым категориям (\"No answer\", \"Don\u0027t know\", \"Other party\") присвоено одно и то же новое имя \u0027Other\u0027. В результате они автоматически склеиваются в одну общую категорию \u0027Other\u0027.","type":"text"},{"text":"Группировка списками: fct_collapse()","type":"heading"},{"text":"40: res3 \u003c- gss_cat %\u003e% mutate(partyid = fct_collapse(partyid,\n41:   other = c(\u0027No answer\u0027, \"Don\u0027t know\", \u0027Other party\u0027),\n42:   rep = c(\u0027Strong republican\u0027, \u0027Not str republican\u0027),\n43:   ind = c(\u0027Ind,near rep\u0027, \u0027Ind,near dem\u0027,\u0027Independent\u0027),\n44:   dem = c(\u0027Not str democrat\u0027, \u0027Strong democrat\u0027)\n45: ))\n47: print(res3 %\u003e% count(partyid))","type":"code"},{"text":"Когда нужно укрупнить сразу много категорий, удобнее использовать fct_collapse() и передавать старые названия списком c(...). Все 10 исходных партийных категорий сжаты в 4 крупные группы: other, rep, ind, dem.","type":"text"},{"text":"Автоматическое слияние мелких групп: fct_lump()","type":"heading"},{"text":"50: rez4 \u003c- gss_cat %\u003e% mutate(partyid = fct_lump(partyid))\n51: print(rez4 %\u003e% count(partyid))\n52: print(gss_cat %\u003e% mutate(relig = fct_lump(relig)) %\u003e% count(relig))","type":"code"},{"text":"Функция fct_lump() сама решает, какие редкие категории склеить в \"Other\" (по умолчанию она объединяет мелкие группы так, чтобы итоговая группа \"Other\" оставалась меньше самой маленькой из оставшихся крупных групп). В строке 52 то же самое показано для религий (relig).","type":"text"},{"text":"55: print(gss_cat %\u003e% mutate(relig = fct_lump(relig, n = 3)) %\u003e% count(relig, sort=TRUE))","type":"code"},{"text":"Параметр n = 3 задаёт жёсткое правило: оставить только 3 самые многочисленные религии, а все остальные объединить в \"Other\". Параметр sort = TRUE в count() сразу сортирует результат от большего к меньшему.","type":"text"}],"rawCode":"library(tidyverse)\r\nlibrary(forcats)\r\n\r\n# содержимое столбца\r\n# print(gss_cat$partyid)\r\n# выведем фактор связанный с столбцом partyid\r\nprint(gss_cat %\u003e% count(partyid))\r\n\r\n# функция fct_recode позволяет изменить значение элементов фактора,\r\n# функция fct_recode на вход принимает:\r\n# 1 - фактор который изменяем\r\n# 2 - новое значение в виде пары: новое_значение = старое_значение\r\nrez \u003c- gss_cat %\u003e% mutate(partyid = fct_recode(partyid,\r\n                                               \u0027Republican, stronge\u0027 = \u0027Strong republican\u0027,\r\n                                               \u0027Republican, weak\u0027 = \u0027Not str republican\u0027,\r\n                                               \u0027Independent, near rep\u0027 = \u0027Ind,near rep\u0027,\r\n                                               \u0027Independent, near dem\u0027 = \u0027Ind,near dem\u0027,\r\n                                               \u0027Democrat, weak\u0027 = \u0027Not str democrat\u0027,\r\n                                               \u0027Democrat, stronge\u0027 = \u0027Strong democrat\u0027\r\n))\r\nprint(rez %\u003e% count(partyid))\r\n\r\n\r\n# при изменении значений фактора можно одному новому элементу присвоить несколько старых значений,\r\n# тогда они объединятся в одну группу (элемента фактора)\r\nres2 \u003c- gss_cat %\u003e% mutate(partyid = fct_recode(partyid,\r\n                                                \u0027Republican, stronge\u0027 = \u0027Strong republican\u0027,\r\n                                                \u0027Republican, weak\u0027 = \u0027Not str republican\u0027,\r\n                                                \u0027Independent, near rep\u0027 = \u0027Ind,near rep\u0027,\r\n                                                \u0027Independent, near dem\u0027 = \u0027Ind,near dem\u0027,\r\n                                                \u0027Democrat, weak\u0027 = \u0027Not str democrat\u0027,\r\n                                                \u0027Democrat, stronge\u0027 = \u0027Strong democrat\u0027,\r\n                                                \u0027Other\u0027= \u0027No answer\u0027,\r\n                                                \u0027Other\u0027= \"Don\u0027t know\",\r\n                                                \u0027Other\u0027= \u0027Other party\u0027\r\n                                                ))\r\nprint(res2 %\u003e% count(partyid))\r\n\r\n# функция fct_collapse позволяет новому значению элемента фактора присвоить вектор старых значений\r\nres3 \u003c- gss_cat %\u003e% mutate(partyid = fct_collapse(partyid,\r\n                                                  other = c(\u0027No answer\u0027, \"Don\u0027t know\", \u0027Other party\u0027),\r\n                                                  rep = c(\u0027Strong republican\u0027, \u0027Not str republican\u0027),\r\n                                                  ind = c(\u0027Ind,near rep\u0027, \u0027Ind,near dem\u0027,\u0027Independent\u0027),\r\n                                                  dem = c(\u0027Not str democrat\u0027, \u0027Strong democrat\u0027)\r\n))\r\n\r\nprint(res3 %\u003e% count(partyid))\r\n\r\n# функция fct_lump позволяет небольшие группы автоматически объединить в одну\r\nrez4 \u003c- gss_cat %\u003e% mutate(partyid = fct_lump(partyid))\r\nprint(rez4 %\u003e% count(partyid))\r\nprint(gss_cat %\u003e% mutate(relig = fct_lump(relig)) %\u003e% count(relig))\r\n\r\n# функция fct_lump на вход может принять второй параметер, сколько групп мы желаем оставить\r\nprint(gss_cat %\u003e% mutate(relig = fct_lump(relig, n = 3)) %\u003e% count(relig, sort=TRUE))\r\n\r\n","dictionary":[{"term":"fct_recode(фактор, \"новое\" = \"старое\", ...)","details":["Что это и зачем нужно: Переименовывает указанные уровни фактора. Если дать нескольким старым уровням одинаковое новое имя, они объединятся. Уровни, которые не упомянуты, остаются как были","Аналогия из Excel: «Найти и заменить» для значений категории"]},{"term":"fct_collapse(фактор, новое = c(\"старое1\", \"старое2\"))","details":["Что это и зачем нужно: Объединяет несколько старых категорий (указанных через c(...)) в одну новую категорию","Аналогия из Excel: Группировка значений в сводной таблице"]},{"term":"fct_lump(фактор)","details":["Что это и зачем нужно: Автоматически объединяет самые маленькие группы в одну общую категорию \"Other\" («Прочее»), оставляя крупные","Аналогия из Excel: Авто-группировка «хвоста» редких значений в «Прочие»"]},{"term":"fct_lump(фактор, n = число)","details":["Что это и зачем нужно: То же самое, но вы сами задаёте, сколько самых крупных категорий оставить (например, n = 3 оставит 3 лидера + \"Other\")"]},{"term":"count(столбец, sort = TRUE)","details":["Что это и зачем нужно: Подсчитывает количество строк по каждой категории и сразу сортирует таблицу по убыванию (самые крупные сверху)"]}],"tag":"fct_recode"},{"id":"3.4","overview":"Этот большой практический скрипт полностью посвящён работе с датами и временем в R с помощью пакета lubridate (входит в семейство tidyverse).\n\nОбычные текстовые строки вроде \"2026-11-25\" компьютер не умеет складывать, вычитать или группировать по неделям. Пакет lubridate превращает текст и числа в настоящие объекты «Дата» и «Дата + Время».\n\nЧто вы научитесь делать:\n  - получать текущую дату и точное время (today, now);\n  - распознавать даты из любых текстовых строк (ymd, mdy, dmy, ymd_hms);\n  - собирать дату-время из отдельных столбцов таблицы (make_datetime) и писать свою мини-функцию;\n  - строить графики распределения рейсов по дням, минутам и неделям;\n  - извлекать из даты год, месяц, день недели, час, минуту (year, month, wday...);\n  - округлять даты вниз/вверх до часа или недели (floor_date, ceiling_date, round_date);\n  - изменять отдельные части даты (update) и вычитать даты друг из друга.","name":"3.4.R","lineCount":155,"walkthrough":[{"text":"1: library(nycflights13)\n2: library(tidyverse)\n3: library(lubridate)","type":"code"},{"text":"Подключаем учебные данные о рейсах, tidyverse и пакет lubridate.","type":"text"},{"text":"Получение текущей даты и разбор строк","type":"heading"},{"text":"7: print(today())\n9: print(now())","type":"code"},{"text":"Выводим текущую дату и текущую дату с точным временем.","type":"text"},{"text":"12: print(ymd(\u00272026*11*25\u0027))\n13: print(mdy(\"January 20 2025\"))\n14: print(dmy(\"31-Jan-2026\"))","type":"code"},{"text":"Превращаем разные текстовые форматы в единый стандарт даты (ГГГГ-ММ-ДД): год-месяц-день (ymd), месяц-день-год (mdy), день-месяц-год (dmy). Lubridate сам понимает звёздочки, дефисы и английские названия месяцев.","type":"text"},{"text":"17: print(ymd_hms(\u00272026-11-25 13/00/05\u0027))\n18: print(ymd_hm(\"2026/10/20 08:07\"))\n19: print(ymd_h(\"2026/10/20 08\"))","type":"code"},{"text":"То же самое, но с временем: с секундами (hms), с минутами (hm) и только с часами (h).","type":"text"},{"text":"Сборка даты-времени из столбцов и своя функция","type":"heading"},{"text":"22: print(flights %\u003e% select(year, month, day, hour, minute))\n24: f12 \u003c- flights %\u003e% select(year, month, day, hour, minute) %\u003e%\n25:   mutate(departure = make_datetime(year, month, day, hour, minute))\n26: print(f12)\n27: view(flights)","type":"code"},{"text":"В таблице flights год, месяц, день, час и минута лежат в отдельных столбцах. Функция make_datetime() склеивает их в один удобный столбец departure.","type":"text"},{"text":"31: make_datetime_100 \u003c- function(year, month, day, time){\n32:   make_datetime(year, month, day, time %/% 60, time %% 60)\n33: }","type":"code"},{"text":"Создаём свою функцию make_datetime_100, которая принимает дату и время числом, разделяя его нацело (%/% 60) и по остатку (%% 60).\n  [!] Примечание: в таблице flights время (например, 517 для 05:17) записано в формате ЧЧММ, поэтому для точного отделения часов и минут обычно делят на 100 (отсюда и название функции _100), а здесь в учебном коде указано 60.","type":"text"},{"text":"35: f1_dt \u003c- flights %\u003e% filter(!is.na(dep_time), !is.na(arr_time)) %\u003e% mutate(\n36:   dep_time = make_datetime_100(year, month, day, dep_time),\n37:   arr_time = make_datetime_100(year, month, day, arr_time),\n38:   sched_dep_time = make_datetime_100(year, month, day, sched_dep_time),\n39:   sched_arr_time = make_datetime_100(year, month, day, sched_arr_time)\n40: ) %\u003e% select(origin, dest, ends_with(\"delay\"), ends_with(\"time\"))\n41: print(f1_dt)","type":"code"},{"text":"Отбрасываем отменённые рейсы (где dep_time или arr_time пустые) и переводим все 4 столбца времени в полноценный формат «Дата + Время», оставив только нужные столбцы.","type":"text"},{"text":"Графики по времени","type":"heading"},{"text":"44: g1 \u003c- f1_dt %\u003e% ggplot(aes(dep_time)) + geom_freqpoly(binwidth = 86400)\n45: print(g1)","type":"code"},{"text":"График количества вылетов за весь год с шагом binwidth = 86400 секунд (= 1 день).","type":"text"},{"text":"48: g2 \u003c- f1_dt %\u003e% filter(dep_time \u003c ymd(20130102)) %\u003e% ggplot(aes(dep_time)) + geom_freqpoly(binwidth = 600)\n49: print(g2)","type":"code"},{"text":"График вылетов только за 1 января 2013 года (dep_time \u003c 2013-01-02) с шагом 600 секунд (= 10 минут).","type":"text"},{"text":"Преобразование типов и эпоха Unix","type":"heading"},{"text":"53: d \u003c- now()\n54: print(d)\n55: print(as_date(d))","type":"code"},{"text":"Берём текущее время now() и через as_date(d) отрезаем часы/минуты/секунды, оставляя только дату.","type":"text"},{"text":"59: n \u003c-32352\n60: print(as_datetime(n))\n62: n \u003c- 60\n63: print(as_date(n))","type":"code"},{"text":"Если передать в as_datetime() число, R считает его количеством секунд, прошедших с 1 января 1970 года («эпоха Unix»). Для as_date() число — это количество дней от 1 января 1970 года.","type":"text"},{"text":"Извлечение частей даты","type":"heading"},{"text":"76: datetime \u003c- ymd_hms(\"2026-11-25 14:26:37\")\n77: print(year(datetime))\n78: print(month(datetime))\n79: print(mday(datetime))\n80: print(yday(datetime))\n81: print(wday(datetime))\n82: print(hour(datetime))\n83: print(minute(datetime))\n84: print(second(datetime))","type":"code"},{"text":"По очереди достаём из даты год (2026), месяц (11), день месяца (25), день года (329), день недели (4 — среда, в США неделя начинается с воскресенья), час (14), минуту (26), секунду (37).","type":"text"},{"text":"88: print(month(datetime, label=TRUE, abbr=FALSE))\n89: print(month(datetime, abbr=FALSE))\n90: print(wday(datetime, label=TRUE, abbr=FALSE))\n91: print(wday(datetime, abbr=FALSE))","type":"code"},{"text":"Параметр label = TRUE просит вывести название текстом («ноябрь» / «среда») вместо числа, а abbr = FALSE — писать название полностью, без сокращений. (Без label = TRUE параметр abbr не влияет, выведутся числа 11 и 4).","type":"text"},{"text":"Анализ вылетов по дням недели и минутам","type":"heading"},{"text":"95: f1_dt \u003c- ...\n101: g3 \u003c- f1_dt %\u003e% mutate(wday = wday(dep_time, label=TRUE)) %\u003e% ggplot(aes(x = wday)) + geom_bar()\n102: print(g3)","type":"code"},{"text":"Вычисляем день недели для каждого вылета и строим столбчатую диаграмму: видно, что в субботу рейсов заметно меньше.","type":"text"},{"text":"105: g4 \u003c- f1_dt %\u003e% mutate(minute = minute(dep_time)) %\u003e% group_by(minute) %\u003e%\n106:   summarise(avg_delay = mean(arr_delay, na.rm=TRUE), n = n()) %\u003e%\n109:   ggplot(aes(minute, avg_delay)) + geom_line()\n110: print(g4)\n113: g5 \u003c- f1_dt %\u003e% mutate(minute = minute(sched_dep_time)) %\u003e% group_by(minute) %\u003e% ...","type":"code"},{"text":"Графики средней задержки прилёта в зависимости от минуты фактического вылета (g4) и минуты вылета по расписанию (g5).","type":"text"},{"text":"Округление дат","type":"heading"},{"text":"125: datetime \u003c- ymd_hms(\"2026-11-25 14:16:37\")\n126: print(floor_date(datetime, \u0027hour\u0027))\n127: print(ceiling_date(datetime, \u0027hour\u0027))\n128: print(round_date(datetime, \u0027hour\u0027))","type":"code"},{"text":"Для 14:16:37: floor_date округлит вниз до 14:00:00, ceiling_date — вверх до 15:00:00, round_date — до ближайшего часа (14:00:00).","type":"text"},{"text":"131: g6 \u003c- f1_dt %\u003e% count(week=floor_date(dep_time, \u0027week\u0027)) %\u003e% ggplot(aes(week, n)) + geom_line()\n132: print(g6)","type":"code"},{"text":"Считаем количество рейсов по неделям (округляя каждую дату вылета вниз до начала недели) и строим график динамики за год.","type":"text"},{"text":"Изменение частей даты и арифметика","type":"heading"},{"text":"135: datetime \u003c- ymd_hms(\"2026-11-25 14:46:37\")\n137: year(datetime) \u003c- 2025\n139: month(datetime) \u003c- 40\n140: print(datetime)","type":"code"},{"text":"Можно менять часть даты напрямую: меняем год на 2025. А если записать заведомо большое значение (month \u003c- 40), лишние месяцы автоматически перекинутся на следующие годы!","type":"text"},{"text":"143: datetime2 \u003c- update(datetime, year = 2025, month = 12, hour = 19)\n144: print(datetime2)","type":"code"},{"text":"Функция update() позволяет аккуратно поменять сразу несколько частей даты за один раз.","type":"text"},{"text":"147: datetime \u003c- ymd(\"2026-11-25\")\n148: datetime2 \u003c- ymd(\"2026-11-20\")\n149: print(datetime - datetime2)","type":"code"},{"text":"Вычитание дат работает напрямую: R ответит \"Time difference of 5 days\".","type":"text"},{"text":"151: rez5 \u003c- f1_dt %\u003e% filter(arr_time \u003cdep_time)\n152: print(rez5)","type":"code"},{"text":"Находим «странные» рейсы, у которых время прилёта оказалось раньше времени вылета (обычно это ночные рейсы, которые вылетели вечером, а прилетели уже после полуночи на следующие сутки, но дата у них осталась прежней).","type":"text"}],"rawCode":"library(nycflights13)\r\nlibrary(tidyverse)\r\nlibrary(lubridate)\r\n\r\n# способы создания дат и времени\r\n# 1 получение текущей даты\r\nprint(today())\r\n# 2 получение текущей даты и времени\r\nprint(now())\r\n\r\n# 1 создание значений даты и времени на основе строк\r\nprint(ymd(\u00272026*11*25\u0027))\r\nprint(mdy(\"January 20 2025\"))\r\nprint(dmy(\"31-Jan-2026\"))\r\n\r\n# # создание даты и времени  на основе строк\r\nprint(ymd_hms(\u00272026-11-25 13/00/05\u0027))\r\nprint(ymd_hm(\"2026/10/20 08:07\"))\r\nprint(ymd_h(\"2026/10/20 08\"))\r\n\r\n# 2 создание значений даты и времени на основе отдельных компонентов\r\nprint(flights %\u003e% select(year, month, day, hour, minute))\r\n\r\nf12 \u003c- flights %\u003e% select(year, month, day, hour, minute) %\u003e%\r\n                  mutate(departure = make_datetime(year, month, day, hour, minute))\r\nprint(f12)\r\nview(flights)\r\n\r\n# реализуем функцию для получения полный даты и времени (как объект datetime) по параметрам:\r\n# год, месяц, день, время заданное в минутах\r\nmake_datetime_100 \u003c- function(year, month, day, time){\r\n  make_datetime(year, month, day, time %/% 60, time %% 60)\r\n}\r\n\r\nf1_dt \u003c- flights %\u003e% filter(!is.na(dep_time), !is.na(arr_time)) %\u003e% mutate(\r\n  dep_time = make_datetime_100(year, month, day, dep_time),\r\n  arr_time = make_datetime_100(year, month, day, arr_time),\r\n  sched_dep_time = make_datetime_100(year, month, day, sched_dep_time),\r\n  sched_arr_time = make_datetime_100(year, month, day, sched_arr_time)\r\n) %\u003e% select(origin, dest, ends_with(\"delay\"), ends_with(\"time\"))\r\nprint(f1_dt)\r\n\r\n# построение графика распределения времени вылета на протяжении года\r\ng1 \u003c- f1_dt %\u003e% ggplot(aes(dep_time)) + geom_freqpoly(binwidth = 86400)\r\nprint(g1)\r\n\r\n# построение графика распределения времени вылета на протяжении одного дня\r\ng2 \u003c- f1_dt %\u003e% filter(dep_time \u003c ymd(20130102)) %\u003e% ggplot(aes(dep_time)) + geom_freqpoly(binwidth = 600)\r\nprint(g2)\r\n\r\n# 3 создание даты и времени на основе других типов\r\n# функции as_datetime() и as_date() позволяют переходить между значениями дата/время и дата\r\nd \u003c- now()\r\nprint(d)\r\nprint(as_date(d))\r\n\r\n\r\n# преобразование секунд пройденых от \"эпохи Unix\" (1970-01-01) в дату: функция as_datetime()\r\n n \u003c-32352\r\n print(as_datetime(n))\r\n# преобразование дней пройденых  от \"эпохи Unix\" (1970-01-01) в дату: функция as_date()\r\nn \u003c- 60\r\nprint(as_date(n))\r\n\r\n\r\n# извлечение из даты/времени составляющих компонентов\r\n# year() -год\r\n# month() - месяц\r\n# mday() - день месяца\r\n# yday() - день года\r\n# wday() - день недели\r\n# hour() - часы\r\n# minute() - минуты\r\n# second() - секунды\r\n\r\ndatetime \u003c- ymd_hms(\"2026-11-25 14:26:37\")\r\nprint(year(datetime))\r\nprint(month(datetime))\r\nprint(mday(datetime))\r\nprint(yday(datetime))\r\nprint(wday(datetime))\r\nprint(hour(datetime))\r\nprint(minute(datetime))\r\nprint(second(datetime))\r\n\r\n# для функций month() и wday() фргумент label=TRUE выдает сокращенное название\r\n# (label=FALSE выдает цифровое значение (по умолчанию), параметр abbr = FALSE выдает полное название)\r\nprint(month(datetime, label=TRUE, abbr=FALSE))\r\nprint(month(datetime, abbr=FALSE))\r\nprint(wday(datetime, label=TRUE, abbr=FALSE))\r\nprint(wday(datetime, abbr=FALSE))\r\n\r\n\r\n# построим график по количеству вылетов самолетов по дням недели\r\nf1_dt \u003c- flights %\u003e% filter(!is.na(dep_time), !is.na(arr_time)) %\u003e% mutate(\r\n  dep_time = make_datetime_100(year, month, day, dep_time),\r\n  arr_time = make_datetime_100(year, month, day, arr_time),\r\n  sched_dep_time = make_datetime_100(year, month, day, sched_dep_time),\r\n  sched_arr_time = make_datetime_100(year, month, day, sched_arr_time)\r\n) %\u003e% select(origin, dest, ends_with(\"delay\"), ends_with(\"time\"))\r\ng3 \u003c- f1_dt %\u003e% mutate(wday = wday(dep_time, label=TRUE)) %\u003e% ggplot(aes(x = wday)) + geom_bar()\r\nprint(g3)\r\n\r\n# построим график среднего времени задержки вылета в зависимости от минут часа\r\ng4 \u003c- f1_dt %\u003e% mutate(minute = minute(dep_time)) %\u003e% group_by(minute) %\u003e%\r\n  summarise(\r\n    avg_delay = mean(arr_delay, na.rm=TRUE),\r\n    n = n()\r\n  ) %\u003e% ggplot(aes(minute, avg_delay)) + geom_line()\r\nprint(g4)\r\n\r\n# построим график по времени вылета по расписанию\r\ng5 \u003c- f1_dt %\u003e% mutate(minute = minute(sched_dep_time)) %\u003e% group_by(minute) %\u003e%\r\n  summarise(\r\n    avg_delay = mean(arr_delay, na.rm =TRUE),\r\n    n = n()\r\n  ) %\u003e% ggplot(aes(minute, avg_delay)) + geom_line()\r\nprint(g5)\r\n\r\n# округление\r\n#  функция floor_date() округление в низ до указаного элемента\r\n#  функция round_date() округление до ближайшего значения\r\n#  функция ceiling_date() округление в верх\r\n\r\ndatetime \u003c- ymd_hms(\"2026-11-25 14:16:37\")\r\nprint(floor_date(datetime, \u0027hour\u0027))\r\nprint(ceiling_date(datetime, \u0027hour\u0027))\r\nprint(round_date(datetime, \u0027hour\u0027))\r\n\r\n# построение графика по количеству вылетов самолетов в неделю\r\ng6 \u003c- f1_dt %\u003e% count(week=floor_date(dep_time, \u0027week\u0027)) %\u003e% ggplot(aes(week, n)) + geom_line()\r\nprint(g6)\r\n\r\n# изменение значения элементов даты\r\ndatetime \u003c- ymd_hms(\"2026-11-25 14:46:37\")\r\nprint(datetime)\r\nyear(datetime) \u003c- 2025\r\nprint(datetime)\r\nmonth(datetime) \u003c- 40\r\nprint(datetime)\r\n\r\n# функция update позволяет изменить в дате сразу несколько элементов\r\ndatetime2 \u003c- update(datetime, year = 2025, month = 12, hour = 19)\r\nprint(datetime2)\r\n\r\n# применение к дате/времени арифметических действий\r\ndatetime \u003c- ymd(\"2026-11-25\")\r\ndatetime2 \u003c- ymd(\"2026-11-20\")\r\nprint(datetime - datetime2)\r\n\r\nrez5 \u003c- f1_dt %\u003e% filter(arr_time \u003cdep_time)\r\nprint(rez5)\r\n\r\n\r\n","dictionary":[{"term":"library(lubridate)","details":["Что это и зачем нужно: Подключает пакет для удобной работы с датами и временем"]},{"term":"today() и now()","details":["Что это и зачем нужно: Возвращают сегодняшнюю дату (today) и текущую дату со временем (now)","Аналогия из Excel: СЕГОДНЯ() и ТДАТА()"]},{"term":"ymd(), mdy(), dmy()","details":["Что это и зачем нужно: Превращают текст в дату. Буквы в названии означают порядок в строке: y — год (year), m — месяц (month), d — день (day). Разделители (-, /, *, пробелы) значения не имеют","Аналогия из Excel: ДАТАЗНАЧ()"]},{"term":"ymd_hms(), ymd_hm(), ymd_h()","details":["Что это и зачем нужно: То же самое, но с часами (h), минутами (m) и секундами (s)"]},{"term":"make_datetime(год, месяц, день, час, мин)","details":["Что это и зачем нужно: Собирает дату и время из отдельных числовых столбцов","Аналогия из Excel: ДАТА() + ВРЕМЯ()"]},{"term":"function(аргументы) { ... }","details":["Что это и зачем нужно: Создание собственной функции, чтобы не повторять одну и ту же формулу много раз"]},{"term":"as_date() и as_datetime()","details":["Что это и зачем нужно: Переводят дату-время в дату (отбрасывая часы/минуты) и обратно, а также переводят числа от «эпохи Unix» (01.01.1970) в дату"]},{"term":"year(), month(), mday(), yday(), wday(), hour(), minute(), second()","details":["Что это и зачем нужно: Извлекают из даты нужную часть: год, месяц, день месяца, день года (1–366), день недели (1–7), час, минуту, секунду","Аналогия из Excel: ГОД(), МЕСЯЦ(), ДЕНЬ(), ДЕНЬНЕД()..."]},{"term":"floor_date(), round_date(), ceiling_date()","details":["Что это и зачем нужно: Округляют дату до указанной единицы (\u0027hour\u0027, \u0027week\u0027 и т.д.): вниз (floor), до ближайшего (round) или вверх (ceiling)"]},{"term":"update(дата, ...)","details":["Что это и зачем нужно: Создаёт новую дату, заменяя сразу несколько её компонентов (например, год и час)"]},{"term":"geom_freqpoly(binwidth = ...)","details":["Что это и зачем нужно: Строит линейную гистограмму распределения (в секундах для оси времени: 86400 сек = 1 сутки, 600 сек = 10 минут)"]}],"tag":"lubridate"}]}];

function escapeHtml(str) {
  return (str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function getAllScripts() {
  const list = [];
  COURSE_DATA.forEach(d => {
    d.scripts.forEach(s => list.push({ ...s, dayId: d.id, dayTitle: d.title, dayColor: d.color }));
  });
  return list;
}

function updateStats() {
  const all = getAllScripts();
  const totalTerms = all.reduce((acc, s) => acc + (s.dictionary ? s.dictionary.length : 0), 0);
  const doneCount = all.filter(s => state.done[s.id]).length;
  document.getElementById("statDays").textContent = COURSE_DATA.length;
  document.getElementById("statScripts").textContent = all.length;
  document.getElementById("statTerms").textContent = totalTerms;
  document.getElementById("statProgress").textContent = `${doneCount} / ${all.length}`;
  document.getElementById("progressFill").style.width = `${Math.round((doneCount / all.length) * 100)}%`;
}

    btn.onclick = () => {
      state.dayFilter = btn.dataset.day;
      renderSidebar();

function matchesSearch(script, q) {
  if (!q) return true;
  const hay = [
    script.name,
    script.tag,
    script.overview,
    script.rawCode,
    ...(script.dictionary || []).map(d => d.term + " " + (d.details || []).join(" ")),
    ...(script.walkthrough || []).map(w => w.text)
  ].join("\n").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderSidebar() {
  const container = document.getElementById("sidebarList");
  const q = state.search.trim();
  let html = "";

  COURSE_DATA.forEach(day => {
    if (state.dayFilter !== "all" && String(day.id) !== state.dayFilter) return;
    const filtered = day.scripts.filter(s => matchesSearch(s, q));
    if (filtered.length === 0) return;

    html += `<div class="day-group">
      <div class="day-group-title">
        <span class="day-dot" style="background:${day.color}"></span>
        День ${day.id}
      </div>`;
    filtered.forEach(s => {
      const active = s.id === state.selectedId ? "active" : "";
      const done = state.done[s.id] ? `<span class="done-badge" title="Изучено">&#10003;</span>` : "";
      html += `<button class="script-item ${active}" data-id="${s.id}">
        <span class="script-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>
        <span class="script-meta">${done}<span class="tag">${escapeHtml(s.tag)}</span></span>
      </button>`;
    });
    html += `</div>`;
  });

  if (!html) {
    html = `<div class="empty-state">Ничего не найдено по запросу «${escapeHtml(q)}»</div>`;
  }
  container.innerHTML = html;
  container.querySelectorAll(".script-item").forEach(btn => {
    btn.onclick = () => {
      state.selectedId = btn.dataset.id;
      closeMobileDrawer();
      renderSidebar();
      renderMain();
      if (window.innerWidth <= 960) {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };
  });
}

  let tabBody = "";
  if (state.activeTab === "overview") {
    tabBody = `<div class="overview-box">${escapeHtml(script.overview || "Описание отсутствует.")}</div>`;
  } else if (state.activeTab === "dict") {
    if (!script.dictionary || script.dictionary.length === 0) {
      tabBody = `<div class="empty-state">Словарь для этого скрипта пуст.</div>`;
    } else {
      tabBody = `<div class="dict-grid">` + script.dictionary.map(item => `

  } else if (state.activeTab === "walkthrough") {
    if (!script.walkthrough || script.walkthrough.length === 0) {
      tabBody = `<div class="empty-state">Построчный разбор отсутствует.</div>`;
    } else {
      tabBody = script.walkthrough.map(b => {
        if (b.type === "heading") return `<div class="walk-heading">${escapeHtml(b.text)}</div>`;
        if (b.type === "code") return `<pre class="code-block">${escapeHtml(b.text)}</pre>`;

      }).join("");
    }
  } else if (state.activeTab === "raw") {
    const codeText = script.rawCode && script.rawCode.trim() ? script.rawCode : "# Файл пуст";
    tabBody = `<div class="raw-wrap">
      <button class="copy-btn" id="copyCodeBtn">Копировать R-код</button>
      <pre class="code-block" style="padding-top:40px;">${escapeHtml(codeText)}</pre>
    </div>`;
  }

  const prev = idx > 0 ? all[idx - 1] : null;
  const next = idx < all.length - 1 ? all[idx + 1] : null;

  panel.innerHTML = `
    <div class="script-header">
      <div>
        <span class="day-badge" style="background:${script.dayColor}">${escapeHtml(script.dayTitle)}</span>

    </div>

      <button class="tab-btn ${state.activeTab === "walkthrough" ? "active" : ""}" data-tab="walkthrough">Построчный разбор</button>
      <button class="tab-btn ${state.activeTab === "dict" ? "active" : ""}" data-tab="dict">Словарь команд (${(script.dictionary || []).length})</button>
      <button class="tab-btn ${state.activeTab === "overview" ? "active" : ""}" data-tab="overview">О чём урок</button>
      <button class="tab-btn ${state.activeTab === "raw" ? "active" : ""}" data-tab="raw">Исходный R-код</button>

    <div class="footer-nav">

function formatAssistantMarkdown(text) {
  const parts = text.split(/```(?:r|R)?\r?\n([\s\S]*?)```/g);
  let html = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const code = parts[i].trim();
      const cid = "c_" + Math.random().toString(36).slice(2, 9);
      html += `<div class="ai-msg-code-wrap">
        <button class="copy-btn" data-copy-id="${cid}">Копировать</button>
        <pre class="code-block" id="${cid}" style="padding-top:34px; margin:4px 0;">${escapeHtml(code)}</pre>
      </div>`;
    } else {
      const txt = parts[i].trim();
      if (txt) {
        const formatted = escapeHtml(txt)
          .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/`([^`]+)`/g, "<code style='background:var(--surface);padding:1px 5px;border-radius:4px;font-family:Consolas,monospace;font-size:12.5px;'>$1</code>")
          .replace(/\n/g, "<br>");
        html += `<div>${formatted}</div>`;
      }
    }
  }
  return html || escapeHtml(text);
}

Правила ответа:
1. Пиши простым, понятным русским языком (для новичка).
2. Используй современный стиль курса (tidyverse / %>%), а не устаревший базовый R, если не просят иное.
3. Обязательно оборачивай готовый R-код в блок \`\`\`r ... \`\`\`.

  if (document.getElementById("aiIncludeLesson").checked) {

async function sendAiMessage() {
  if (aiBusy) return;
  const input = document.getElementById("aiInput");
  const text = input.value.trim();
  if (!text) return;

  if (!aiCfg.baseUrl || !aiCfg.apiKey || !aiCfg.model) {
    aiHistory.push({ role: "error", content: "Заполните Base URL, API Key и ID модели в настройках (кнопка ⚙ Настройки)." });
    renderAiMessages();
    return;
  }

  aiHistory.push({ role: "user", content: text });
  input.value = "";
  aiBusy = true;
  const sendBtn = document.getElementById("aiSendBtn");
  sendBtn.disabled = true;
  sendBtn.textContent = "Думаю...";
  renderAiMessages();

  const useServerProxy = location.protocol.startsWith("http") && aiCfg.baseUrl.replace(/\/+$/, "") === DEFAULT_AI_CFG.baseUrl;
  const endpoint = useServerProxy ? "/api/chat" : aiCfg.baseUrl.replace(/\/+$/, "") + "/chat/completions";
  const apiMessages = [
    { role: "system", content: buildSystemPrompt() },
    ...aiHistory.filter(m => m.role === "user" || m.role === "assistant").slice(-8)
  ];

  const reqHeaders = { "Content-Type": "application/json" };
  if (!useServerProxy) {
    reqHeaders["Authorization"] = `Bearer ${aiCfg.apiKey}`;
  }

  const autoFallback = document.getElementById("aiAutoFallback").checked;
  const modelsToTry = [aiCfg.model];
  if (autoFallback) {
    FREE_MODELS.forEach(m => { if (!modelsToTry.includes(m)) modelsToTry.push(m); });
  }

  try {
    let reply = null;
    let usedModel = aiCfg.model;
    let lastError = null;

    for (let i = 0; i < modelsToTry.length; i++) {
      const candidate = modelsToTry[i];
      if (i > 0) sendBtn.textContent = `Пробую ${i + 1}/${modelsToTry.length}...`;

      const resp = await fetch(endpoint, {
        method: "POST",
        headers: reqHeaders,
        body: JSON.stringify({
          model: candidate,
          messages: apiMessages,
          temperature: 0.2
        })
      });

      if (resp.status === 429 || resp.status === 503) {
        const errText = await resp.text();
        lastError = new Error(`HTTP ${resp.status} (${candidate}): ${errText.slice(0, 200)}`);
        continue;
      }

      if (!resp.ok) {
        const errText = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${errText.slice(0, 300)}`);
      }

      const data = await resp.json();
      const content = data?.choices?.[0]?.message?.content;
      if (!content) throw new Error("Модель вернула пустой ответ.");
      reply = content;
      usedModel = candidate;
      break;
    }

    if (!reply) {
      throw lastError || new Error("Все выбранные модели сейчас перегружены (429). Попробуйте чуть позже.");
    }

    const switchedFrom = usedModel !== aiCfg.model ? aiCfg.model : null;
    if (switchedFrom) {
      aiCfg.model = usedModel;
      localStorage.setItem(STORAGE_AI_CFG, JSON.stringify(aiCfg));
      syncAiSettingsUI();
    }
    aiHistory.push({ role: "assistant", content: reply, usedModel, switchedFrom });
  } catch (err) {
    let msg = `Ошибка запроса: ${err.message}`;
    if (err.message.includes("Failed to fetch") || err.name === "TypeError") {
      msg += "\n\nПодсказка: возможно, сервер API блокирует прямые запросы из браузера (CORS) или нет подключения к интернету.";
    }
    aiHistory.push({ role: "error", content: msg });
  } finally {
    aiBusy = false;
    sendBtn.disabled = false;
    sendBtn.textContent = "Решить";
    renderAiMessages();
  }
}
